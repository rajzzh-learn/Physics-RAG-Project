name: Keep Physics Streamlit App Alive

on:
  schedule:
    # Pings the app every 6 hours to prevent Streamlit sleep (threshold ~12 hrs)
    - cron: "0 */6 * * *"
  workflow_dispatch: # allows manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Physics Streamlit app
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            "https://physics-rag-project-tanishaa.streamlit.app/")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "App is alive."
          else
            echo "Warning: unexpected status $STATUS"
          fi
